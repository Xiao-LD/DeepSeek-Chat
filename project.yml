name: DeepSeekChat
options:
  bundleIdPrefix: com.daniel.DeepSeekChat
  deploymentTarget:
    iOS: "16.0"
targets:
  DeepSeekChat:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.yml"
          - "*.md"
          - ".github"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.DeepSeekChat.DeepSeekChat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: minimal