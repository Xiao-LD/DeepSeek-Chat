name: DeepSeekChat
options:
  bundleIdPrefix: com.daniel.DeepSeekChat
  deploymentTarget:
    iOS: "16.0"
targets:
  DeepSeekChat:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.yml"
          - "*.md"
          - ".github"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.DeepSeekChat.DeepSeekChat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 🔥 新增的权限声明
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "需要麦克风权限以便进行语音输入"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "需要语音识别权限以便将语音转换为文字"