name: DeepSeekChat
options:
  bundleIdPrefix: com.daniel.DeepSeekChat
  deploymentTarget:
    iOS: "26.0" # 保持 26.0
targets:
  DeepSeekChat:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.yml"
          - "*.md"
          - ".github"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.DeepSeekChat.DeepSeekChat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0" # 🔥 退回 5.0，关闭严厉的 6.0 并发拦截
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "需要麦克风权限以便进行语音输入"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "需要语音识别权限以便将语音转换为文字"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要访问相册以发送图片给 AI"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "需要保存图片权限以导出对话长图"